[project]
name = "ha-vesync-extended"
version = "0.1.0"
description = "Experimental Home Assistant support for newer Levoit devices"
requires-python = ">=3.13"
dependencies = ["pyvesync==3.4.2"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

