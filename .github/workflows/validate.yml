name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'pyvesync==3.4.2' pytest pytest-asyncio ruff
      - run: python -m pytest
      - run: ruff check .
      - run: ruff format --check .
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test with the target Home Assistant runtime
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/project:ro"
          --entrypoint python
          ghcr.io/home-assistant/home-assistant:2026.9.4
          /project/scripts/smoke_ha.py
